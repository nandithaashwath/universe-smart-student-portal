<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="uv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F8" />
      <stop offset="100%" stop-color="#F9E9ED" />
    </linearGradient>
    <linearGradient id="uv-rose-mauve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D69CB0" />
      <stop offset="50%" stop-color="#C58FA3" />
      <stop offset="100%" stop-color="#A77C94" />
    </linearGradient>
    <linearGradient id="uv-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C58FA3" />
      <stop offset="100%" stop-color="#8F627B" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C58FA3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="120" height="120" rx="30" fill="url(#uv-bg)" stroke="#EAD6DC" stroke-width="2.5" />

  <!-- Main Elegant Letter 'U' -->
  <path
    d="M 37 32 L 37 63 C 37 81 47 89 60 89 C 73 89 83 81 83 63 L 83 44"
    fill="none"
    stroke="url(#uv-rose-mauve)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft-shadow)"
  />

  <!-- Subtle Open Book Base Motif -->
  <path
    d="M 44 99 Q 52 95 60 97 Q 68 95 76 99"
    fill="none"
    stroke="#A77C94"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Academic Star (Diamond Star Accent) -->
  <path
    d="M 85 14 Q 85 24 75 24 Q 85 24 85 34 Q 85 24 95 24 Q 85 24 85 14 Z"
    fill="url(#uv-star)"
    filter="url(#soft-shadow)"
  />
  <circle cx="85" cy="24" r="1.5" fill="#FFF9F8" />
</svg>
